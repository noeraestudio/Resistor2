name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih tipe build APK'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔧 Ensure Gradle Wrapper Exists & Executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: 🔑 Prepare Keystore (If Available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug keystore..."
            base64 --decode debug.keystore.base64 > debug.keystore || true
          fi

      - name: 🔨 Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew assembleDebug --stacktrace
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/NoeraeResistor-debug.apk

      - name: 🔨 Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-output/NoeraeResistor-release.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk build-output/NoeraeResistor-release.apk 2>/dev/null || true

      - name: 📦 Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoeraeResistor-APKs
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
